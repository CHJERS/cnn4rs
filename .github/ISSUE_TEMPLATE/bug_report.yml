name: Bug report
description: Report reproducible unexpected behavior in cnn4rs.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a problem. Do not include security vulnerabilities here; use SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: cnn4rs version or commit
      placeholder: 0.1.0-SNAPSHOT or a commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include JDK version, operating system, Maven version, and GDAL version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide commands, a small code sample, and the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      render: text
