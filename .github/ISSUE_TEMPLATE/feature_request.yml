name: Feature request
description: Propose a focused improvement to cnn4rs.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the research or learning workflow that is currently difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Describe a small public surface and an example of how it would be used.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain existing APIs, tools, or workflows you evaluated.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request does not assume the experimental distributed module is production-ready.
          required: true
